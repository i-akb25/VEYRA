name: Source health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check official employer feeds
        env:
          VEYRA_SOURCE_SAMPLE: 60
        run: node scripts/verify-sources.mjs | tee source-health.log
      - name: Publish run summary
        if: always()
        run: |
          echo "## VEYRA employer source health" >> "$GITHUB_STEP_SUMMARY"
          echo "Daily rotating 60-board spot check at 03:17 UTC. The separate employer-refresh workflow checks the full registry and discovery candidates." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: |
            source-health-report.json
            source-health.log
          retention-days: 30

  benchmark-public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure fixed local and global searches
        env:
          VEYRA_BENCHMARK_URL: https://veyra-pro.vercel.app
        run: node scripts/benchmark-search.mjs
      - name: Upload public benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-${{ github.run_id }}
          path: search-quality-report.json
          retention-days: 30
