name: Source health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check official employer feeds
        env:
          VEYRA_PUBLISH_SOURCE_FACTS: "true"
        run: node scripts/verify-sources.mjs | tee source-health.log
      - name: Publish public source counts
        run: |
          git config user.name "VEYRA source maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/employers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh public employer vacancy counts"
          git push origin HEAD:main
      - name: Publish run summary
        if: always()
        run: |
          echo "## VEYRA employer source health" >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduled daily at 03:17 UTC. See the attached report for feed counts and failures." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-health-${{ github.run_id }}
          path: |
            source-health-report.json
            source-health.log
          retention-days: 30

  benchmark-public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Measure fixed local and global searches
        env:
          VEYRA_BENCHMARK_URL: https://veyra-pro.vercel.app
        run: node scripts/benchmark-search.mjs
      - name: Upload public benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: search-quality-${{ github.run_id }}
          path: search-quality-report.json
          retention-days: 30
