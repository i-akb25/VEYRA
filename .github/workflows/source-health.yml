name: Source health

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check official employer feeds
        run: node scripts/verify-sources.mjs | tee source-health.log
      - name: Audit employer registry
        run: node scripts/audit-employer-registry.mjs
      - name: Publish run summary
        if: always()
        run: |
          echo "## VEYRA employer source health" >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduled daily at 03:17 UTC. This verification never commits to main or triggers a production deployment. See the attached report for feed counts and failures." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-health-${{ github.run_id }}
          path: |
            source-health-report.json
            source-health.log
          retention-days: 30

  benchmark-public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Measure fixed local and global searches
        env:
          VEYRA_BENCHMARK_URL: https://veyra-pro.vercel.app
        run: node scripts/benchmark-search.mjs
      - name: Upload public benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: search-quality-${{ github.run_id }}
          path: search-quality-report.json
          retention-days: 30
