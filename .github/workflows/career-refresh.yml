name: Refresh official career pages
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: career-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/refresh-career-pages.mjs
      - name: Publish public vacancy snapshot
        run: |
          git config user.name "VEYRA source maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/career-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh official career-page vacancies"
          git push origin HEAD:main
