name: Refresh employer coverage

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: employer-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect permitted public APIs
        env:
          VEYRA_REFRESH_SHARDS: 4
          VEYRA_REFRESH_SHARD: ${{ matrix.shard }}
        run: node scripts/refresh-employers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-${{ matrix.shard }}
          path: source-refresh-${{ matrix.shard }}.json
          retention-days: 14

  publish:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: refresh-*
          merge-multiple: true
          path: refresh-reports
      - name: Merge source evidence
        run: node scripts/merge-employer-refresh.mjs refresh-reports
      - name: Discover additional candidates weekly
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/discover-employers.mjs
          fi
      - name: Monitor official government sources
        run: node --experimental-strip-types scripts/check-government-sources.mjs
      - name: Publish only registry and public coverage counts
        run: |
          git config user.name "VEYRA source maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/employers.json data/coverage-summary.json data/employer-candidates.json data/government-source-checks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh public employer coverage"
          git push origin HEAD:main
